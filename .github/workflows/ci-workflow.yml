name: CI for develop branch

on:
  pull_request:
    branches: ["develop"]

defaults:
  run:
    working-directory: server

jobs:
  docker-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file with CI defaults
        run: |
          cat > .env << 'EOF'
          MARIADB_ROOT_PASSWORD=ci_root
          MARIADB_DATABASE=agenda
          MARIADB_USER=ci_user
          MARIADB_PASSWORD=ci_password
          JWT_SECRET=ci-jwt-secret-key-for-testing-only-must-be-32-chars
          JWT_EXPIRATION=86400000
          REDIS_PASSWORD=ci_redis_password
          CORS_ALLOWED_ORIGINS=http://localhost:5173/
          APP_COOKIE_SECURE=false
          APP_COOKIE_SAME_SITE=Lax
          EOF

      - name: Ensure external Docker network exists
        run: docker network inspect coolify >/dev/null 2>&1 || docker network create coolify

      - name: Build Docker containers
        run: docker compose up -d --build

      - name: Verify containers are running
        run: docker compose ps

      - name: Wait for app healthcheck
        run: |
          echo "Waiting the app is healthy..."
          timeout=120

          while [ $timeout -gt 0 ]; do
            if docker compose ps app | grep -q "healthy"; then
              echo "App is healthy"
              exit 0
            fi

            sleep 5
            timeout=$((timeout - 5))
          done

          echo "Timeout: App no se puso saludable"
          docker compose logs app
          exit 1

      - name: Verify app responds to requests
        run: curl --fail http://localhost:8080/actuator/health

      - name: Down containers
        if: always()
        run: docker compose down -v

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Run unit tests
        run: ./mvnw clean test

  generate-javadoc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Generate Javadoc
        run: ./mvnw javadoc:javadoc

      - name: Upload Javadoc
        uses: actions/upload-artifact@v4
        with:
          name: javadoc
          path: server/doc/
