name: Publicar actualización móvil

on:
  push:
    branches:
      - main
    paths:
      - "front end/movil/**"

permissions:
  contents: read

concurrency:
  group: mobile-eas-update-production
  cancel-in-progress: true

jobs:
  publish-update:
    name: Validar y publicar en EAS Update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: "front end/movil"

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Comprobar secretos requeridos
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Falta el secreto EXPO_TOKEN del proyecto Expo."
            exit 1
          fi

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: "front end/movil/package-lock.json"

      - name: Configurar EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependencias exactas
        run: npm ci

      - name: Ejecutar pruebas móviles
        run: npm test -- --runInBand

      - name: Validar compatibilidad con Expo
        run: npx expo-doctor

      - name: Publicar actualización obligatoria
        run: eas update --channel production --environment production --message "main:${GITHUB_SHA}" --non-interactive
