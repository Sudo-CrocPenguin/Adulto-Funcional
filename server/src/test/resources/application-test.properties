# El esquema de pruebas debe ser exactamente el producido por las migraciones.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
app.jobs.enabled=false

jwt.secret=your-test-secret-key-must-be-at-least-32-characters-long-for-hs256
jwt.expiration=900000
jwt.issuer=adulto-funcional-server-test
jwt.audience=adulto-funcional-test-clients

auth.session.refresh-expiration=2592000000
auth.session.replay-window-seconds=5
auth.session.refresh-token-bytes=32
master-key.session.ttl=3600000

CORS_ALLOWED_ORIGINS=http://localhost:3000

COOKIE_SECURE=false
APP_COOKIE_SECURE=true
APP_COOKIE_SAME_SITE=Lax
